<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#f8f6f0"/><link rel="icon" href="/favicon.svg"/><meta name="description" content="Explore Yuvraj Kashyap’s personal book collection by title, author, and category."/><script>try{
if (location.pathname === "/" && !Object.keys(localStorage).some(key => /^sb-.+-auth-token$/.test(key))) {
  const preload = (as, href) => {
    const link = document.createElement("link");
    link.rel = "preload";
    link.as = as;
    link.href = href;
    if (as === "fetch") link.crossOrigin = "anonymous";
    document.head.append(link);
  };
  preload("fetch", "/api/shelf");
}
}catch{}</script><title>Yuvraj’s Bookshelf · Yuvraj Kashyap</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
